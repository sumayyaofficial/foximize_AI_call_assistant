<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foximize AI Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        #recordButton {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: #111;
            color: white;
            font-size: 35px;
            cursor: pointer;
            transition: 0.2s;
        }

        #recordButton.recording {
            background: #d62828;
            transform: scale(1.08);
        }

        #status {
            margin: 20px 0;
            color: #666;
        }

        .result {
            text-align: left;
            margin-top: 25px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 12px;
        }

        .label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Foximize AI Voice Assistant</h1>

    <div class="subtitle">
        Ask anything about Foximize courses, fees, and programs
    </div>

    <button id="recordButton">🎙️</button>

    <div id="status">
        Click the microphone to start voice chat
    </div>

    <div style="margin: 20px 0; display: flex; gap: 8px;">
        <input id="textInput" type="text" placeholder="Or type your question here..." style="flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
        <button id="sendTextButton" style="padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Send</button>
    </div>

    <div class="result">

        <div class="label">
            You said:
        </div>

        <div id="transcription">
            —
        </div>

        <br>

        <div class="label">
            AI Response:
        </div>

        <div id="response">
            —
        </div>

        <div id="sources" style="margin-top: 10px; font-size: 12px; color: #888;"></div>

        <audio id="audioPlayer" controls style="display: none;"></audio>

    </div>

</div>

<script>

let mediaRecorder;
let audioChunks = [];

const recordButton = document.getElementById("recordButton");
const status = document.getElementById("status");
const textInput = document.getElementById("textInput");
const sendTextButton = document.getElementById("sendTextButton");
const transcriptionElem = document.getElementById("transcription");
const responseElem = document.getElementById("response");
const sourcesElem = document.getElementById("sources");
const audioPlayer = document.getElementById("audioPlayer");

// Text chat handler
sendTextButton.addEventListener("click", async () => {
    const message = textInput.value.trim();
    if (!message) return;

    transcriptionElem.innerText = message;
    responseElem.innerText = "Thinking...";
    sourcesElem.innerText = "";
    status.innerText = "Processing text query...";
    sendTextButton.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
        });

        if (!response.ok) {
            throw new Error(`Server returned status ${response.status}`);
        }

        const data = await response.json();
        responseElem.innerText = data.response;
        if (data.sources && data.sources.length) {
            sourcesElem.innerText = "Sources: " + data.sources.join(", ");
        }
        status.innerText = "Done";
        textInput.value = "";
    } catch (err) {
        console.error(err);
        responseElem.innerText = "Error: Unable to process request.";
        status.innerText = "Failed";
    } finally {
        sendTextButton.disabled = false;
    }
});

textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        sendTextButton.click();
    }
});

// Voice recording handler
recordButton.addEventListener("click", async () => {

    if (!mediaRecorder || mediaRecorder.state === "inactive") {

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
        } catch (err) {
            status.innerText = "Microphone access denied or unavailable.";
            return;
        }

        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async () => {
            status.innerText = "Processing voice query...";
            recordButton.disabled = true;

            const audioBlob = new Blob(audioChunks, {
                type: "audio/webm"
            });

            const formData = new FormData();
            formData.append("file", audioBlob, "voice.webm");

            try {
                const response = await fetch("/voice-chat", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status ${response.status}`);
                }

                const data = await response.json();

                transcriptionElem.innerText = data.transcribed_text || "(empty)";
                responseElem.innerText = data.response;

                if (data.sources && data.sources.length) {
                    sourcesElem.innerText = "Sources: " + data.sources.join(", ");
                }

                if (data.audio_url) {
                    audioPlayer.src = data.audio_url;
                    audioPlayer.style.display = "block";
                    audioPlayer.play().catch(e => console.log("Auto-play prevented:", e));
                }

                status.innerText = "Done";

            } catch (error) {
                console.error(error);
                status.innerText = "Something went wrong. Please try again.";
                responseElem.innerText = "Unable to process voice request.";
            } finally {
                recordButton.disabled = false;
            }
        };

        mediaRecorder.start();
        recordButton.classList.add("recording");
        recordButton.innerText = "⏹️";
        status.innerText = "Listening... Click again to stop";

    } else {
        mediaRecorder.stop();
        recordButton.classList.remove("recording");
        recordButton.innerText = "🎙️";
        status.innerText = "Processing...";
    }
});

</script>

</body>
</html>
